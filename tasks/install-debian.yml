---
# ---------------------------------------------------------------------------
# Apt repository codename resolution
#
# Determines the effective apt codename to use for the GitLab Runner repo.
# For supported releases the standard install script is used (unchanged
# behaviour). For unsupported releases (e.g. Resolute Raccoon / Ubuntu 26.04)
# the repo is configured manually using the fallback codename so the script's
# lsb_release auto-detection is bypassed entirely.
# ---------------------------------------------------------------------------
- name: "(Debian) Determine effective apt repository codename"
  ansible.builtin.set_fact:
    _gitlab_runner_effective_apt_codename: >-
      {%- if gitlab_runner_apt_repo_codename | default('') != '' -%}
        {{ gitlab_runner_apt_repo_codename }}
      {%- elif ansible_facts['distribution_release'] in (gitlab_runner_apt_supported_codenames | default([])) -%}
        {{ ansible_facts['distribution_release'] }}
      {%- else -%}
        {{ gitlab_runner_apt_codename_fallback | default('questing') }}
      {%- endif -%}
    _gitlab_runner_codename_needs_manual_repo: >-
      {{ ansible_facts['distribution_release'] not in (gitlab_runner_apt_supported_codenames | default([]))
         or (gitlab_runner_apt_repo_codename | default('')) != '' }}
  when: gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install

# ---------------------------------------------------------------------------
# Manual apt repo setup — used when the host codename is not in
# gitlab_runner_apt_supported_codenames (e.g. Resolute Raccoon) or when an
# explicit gitlab_runner_apt_repo_codename override is provided.
# ---------------------------------------------------------------------------
- name: "(Debian) Ensure /etc/apt/keyrings directory exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

- name: "(Debian) Download GitLab Runner repository GPG key"
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    dest: /tmp/gitlab-runner-gpgkey.asc
    mode: "0644"
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

- name: "(Debian) Dearmor GitLab Runner GPG key into keyring"
  ansible.builtin.command:
    cmd: gpg --dearmor -o {{ gitlab_runner_keyring_path }} /tmp/gitlab-runner-gpgkey.asc
    creates: "{{ gitlab_runner_keyring_path }}"
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

- name: "(Debian) Set GitLab Runner GPG keyring permissions"
  ansible.builtin.file:
    path: "{{ gitlab_runner_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

- name: "(Debian) Add GitLab Runner apt repository using codename '{{ _gitlab_runner_effective_apt_codename | default('') }}'"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/runner_gitlab-runner.list
    content: |
      deb [signed-by={{ gitlab_runner_keyring_path }}] https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ {{ _gitlab_runner_effective_apt_codename }} main
      deb-src [signed-by={{ gitlab_runner_keyring_path }}] https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ {{ _gitlab_runner_effective_apt_codename }} main
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

- name: "(Debian) Update apt cache after manual repository configuration"
  ansible.builtin.apt:
    update_cache: true
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - _gitlab_runner_codename_needs_manual_repo | default(false)

# ---------------------------------------------------------------------------
# Script-based apt repo setup — used only for supported/native codenames.
# ---------------------------------------------------------------------------
- name: "(Debian) Get Gitlab repository installation script"
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/{{ gitlab_runner_package_name }}/script.deb.sh
    dest: /tmp/gitlab-runner.script.deb.sh
    mode: "0744"
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - not (_gitlab_runner_codename_needs_manual_repo | default(false))

- name: "(Debian) Install Gitlab repository"
  ansible.builtin.command:
    cmd: bash /tmp/gitlab-runner.script.deb.sh
  become: true
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - not (_gitlab_runner_codename_needs_manual_repo | default(false))

- name: "(Debian) Find GitLab runner repository GPG keyring"
  ansible.builtin.stat:
    path: "{{ gitlab_runner_keyring_path }}"
  register: gitlab_runner_keyring_stat
  when: gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install

- name: "(Debian) Ensure GitLab runner repository GPG key is readable by everyone"
  ansible.builtin.file:
    path: "{{ gitlab_runner_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - gitlab_runner_skip_package_repo_install is not defined or not gitlab_runner_skip_package_repo_install
    - gitlab_runner_keyring_stat.stat.exists

- name: "(Debian) Update gitlab_runner_package_name and gitlab_runner_helper_package_name"
  ansible.builtin.set_fact:
    gitlab_runner_package: "{{ gitlab_runner_package_name }}={{ gitlab_runner_package_version }}"
    gitlab_runner_helper_package: "{{ gitlab_runner_helper_package_name }}={{ gitlab_runner_package_version }}"
    gitlab_runner_package_state: present
  when: gitlab_runner_package_version is defined

- name: "(Debian) Set gitlab_runner_package_name"
  ansible.builtin.set_fact:
    gitlab_runner_package: "{{ gitlab_runner_package_name }}"
    gitlab_runner_helper_package: "{{ gitlab_runner_helper_package_name }}"
    gitlab_runner_package_state: latest
  when: gitlab_runner_package_version is not defined

- name: "Gather the package facts"
  ansible.builtin.package_facts:
    manager: apt

- name: "(Debian) Unhold GitLab Runner version"
  changed_when: false
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_runner_package_name }}"
    selection: install
  become: true
  when: "'gitlab-runner' in ansible_facts.packages"

- name: "(Debian) Unhold GitLab Runner Helper version"
  changed_when: false
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_runner_helper_package_name }}"
    selection: install
  become: true
  when:
    - ('gitlab-runner-helper-images' in ansible_facts.packages)
    - (gitlab_runner_package_version is undefined or gitlab_runner_package_version is version('17.7.0', '>='))

- name: "(Debian) Install GitLab Runner Helpers"
  ansible.builtin.apt:
    name: "{{ gitlab_runner_helper_package }}"
    state: "{{ gitlab_runner_package_state }}"
    allow_change_held_packages: true
    allow_downgrade: true
  become: true
  when: gitlab_runner_package_version is undefined or gitlab_runner_package_version is version('17.7.0', '>=')

- name: "(Debian) Install GitLab Runner"
  ansible.builtin.apt:
    name: "{{ gitlab_runner_package }}"
    state: "{{ gitlab_runner_package_state }}"
    allow_change_held_packages: true
    allow_downgrade: true
  become: true

- name: "(Debian) Hold GitLab Runner version"
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_runner_package_name }}"
    selection: hold
  become: true
  when: gitlab_runner_package_version is defined
  changed_when: false

- name: "(Debian) Hold GitLab Runner Helpers version"
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_runner_helper_package_name }}"
    selection: hold
  become: true
  when: gitlab_runner_package_version is undefined or gitlab_runner_package_version is version('17.7.0', '>=')
  changed_when: false

- name: "(Debian) Remove ~/gitlab-runner/.bash_logout"
  ansible.builtin.file:
    path: /home/gitlab-runner/.bash_logout
    state: absent
  when: gitlab_runner_remove_bash_logout

- name: "Set systemd reload options"
  ansible.builtin.import_tasks: systemd-reload.yml
